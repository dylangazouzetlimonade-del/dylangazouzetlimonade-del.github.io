<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le Coffre</title>
<!-- clé de secours : BANANE -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#0d1420;        /* night steel */
  --panel:#151f2f;     /* box face */
  --line:#2a3850;      /* rivets, borders */
  --fg:#e7e2d6;        /* paper white */
  --muted:#8b96a8;     /* engraved text */
  --brass:#c9a14a;     /* brass plates */
  --brass-dim:#7d6430;
  --bad:#e0745c;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Barlow","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{color:var(--fg);font-family:var(--body);font-size:1rem;line-height:1.55;padding-inline:16px;padding-block:32px 64px}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:32px}
header{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center}
.dial{width:112px;aspect-ratio:1;max-width:100%;border-radius:50%;position:relative;
  background:radial-gradient(circle at 50% 50%,var(--panel) 0 38%,var(--line) 39% 41%,var(--panel) 42% 100%);
  border:3px solid var(--brass-dim);box-shadow:inset 0 0 0 6px var(--bg),0 0 0 1px var(--line);transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.dial::before{content:"";position:absolute;inset:8px;border-radius:50%;
  background:repeating-conic-gradient(var(--brass) 0 1.2deg,transparent 1.2deg 10deg);
  -webkit-mask:radial-gradient(circle,transparent 0 58%,#000 59% 66%,transparent 67%);mask:radial-gradient(circle,transparent 0 58%,#000 59% 66%,transparent 67%)}
.dial::after{content:"";position:absolute;left:50%;top:6px;width:4px;height:16px;margin-left:-2px;background:var(--brass);border-radius:2px}
h1{font-family:var(--display);font-weight:900;font-size:clamp(2.6rem,9vw,4.2rem);line-height:.9;letter-spacing:.02em;margin:0;text-transform:uppercase;text-wrap:balance}
.lede{margin:.5rem 0 0;color:var(--muted);max-width:44ch}
form{display:flex;flex-wrap:wrap;gap:12px}
label.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#code{flex:1 1 240px;min-width:0;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;
  padding:14px 16px;font-family:var(--mono);font-size:1.1rem;letter-spacing:.12em;text-transform:uppercase}
#code:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
button{background:var(--brass);color:var(--bg);border:0;border-radius:6px;padding:14px 22px;font-family:var(--display);font-weight:700;font-size:1.25rem;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
button:hover{filter:brightness(1.08)}
button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
button[disabled]{opacity:.6;cursor:wait}
.status{min-height:1.6em;margin:-16px 0 0;font-family:var(--mono);font-size:.9rem;color:var(--muted)}
.status.bad{color:var(--bad)}
.note{border:1px dashed var(--brass-dim);border-radius:6px;padding:14px 16px;color:var(--fg)}
.note[hidden]{display:none}
.tally{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:8px;font-family:var(--mono);font-size:.85rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.tally b{color:var(--brass);font-variant-numeric:tabular-nums}
#doors{display:flex;flex-direction:column;gap:20px}
.empty{color:var(--muted);font-style:italic;margin:0}
.box{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:20px;display:grid;grid-template-columns:1fr auto;gap:8px 20px;animation:open .6s ease-out}
.box>div{min-width:0}
.plate{display:inline-block;font-family:var(--display);font-weight:700;font-size:.95rem;letter-spacing:.14em;text-transform:uppercase;color:var(--bg);background:var(--brass);padding:2px 10px;border-radius:3px;margin-bottom:10px}
.box p{margin:0 0 .7em;max-width:60ch}
.box p:last-child{margin-bottom:0}
.frag{align-self:start;display:flex;flex-direction:column;align-items:center;gap:4px}
.frag span{font-family:var(--mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.frag b{display:grid;place-items:center;width:56px;height:64px;border:2px solid var(--brass);border-radius:6px;font-family:var(--display);font-weight:900;font-size:2.4rem;color:var(--brass)}
.box figure{grid-column:1/-1;margin:8px 0 0}
.box figure img{display:block;width:100%;border-radius:4px;border:1px solid var(--line)}
.box figcaption{font-size:.9rem;color:var(--muted);margin-top:8px}
.box a{color:var(--brass)}
.obj{font-family:var(--display);font-weight:900;font-size:2.2rem;line-height:1;letter-spacing:.03em;text-transform:uppercase;color:var(--fg);margin:0 0 .4em}
.final{border-color:var(--brass)}
.obj-box{border-style:dashed}
.box audio{width:100%;margin-top:4px}
.final .plate{font-size:1.1rem}
@keyframes open{from{transform:translateY(-6px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.box{animation:none}.dial{transition:none}}
@media (max-width:460px){header{grid-template-columns:1fr}.dial{width:84px}.box{grid-template-columns:1fr}.frag{flex-direction:row;justify-self:start}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="dial" id="dial" aria-hidden="true"></div>
    <div>
      <h1>Le Coffre</h1>
      <p class="lede">Chaque indice que tu gagnes cache une clé. Écris-la ici. Si elle est bonne, une porte s'ouvre.</p>
    </div>
  </header>

  <form id="f" autocomplete="off">
    <label class="sr" for="code">Clé</label>
    <input id="code" name="code" placeholder="TA CLÉ" spellcheck="false" autocapitalize="characters">
    <button id="go" type="submit">Ouvrir</button>
  </form>
  <p class="status" id="status" role="status" aria-live="polite"></p>
  <div class="note" id="note" hidden></div>

  <section aria-label="Portes ouvertes">
    <div class="tally"><span>Portes ouvertes</span><b id="count">0</b></div>
    <div id="doors"><p class="empty">Aucune porte ouverte pour l'instant.</p></div>
  </section>
</div>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const norm=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().replace(/[^A-Z0-9]/g,"");
async function keyFor(code){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(code),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(SALT),iterations:ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
}
async function tryCode(code){
  const k=await keyFor(code);
  for(const e of ENTRIES){
    try{const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(e.iv)},k,b64(e.ct));const r=JSON.parse(new TextDecoder().decode(pt));r._k=k;return r;}catch(_){}
  }
  return null;
}
const opened=new Map();
const $=id=>document.getElementById(id);
function render(){
  const list=[...opened.values()].sort((a,b)=>a.n-b.n);
  $("count").textContent=list.filter(d=>!d.obj).length;
  $("doors").innerHTML=list.length?list.map(d=>`<article class="box${d.final?" final":""}${d.obj?" obj-box":""}"><div><span class="plate">${d.title}</span>${d.html}</div>${d.frag?`<div class="frag"><span>Fragment</span><b>${d.frag}</b></div>`:""}${d.figure||""}</article>`).join(""):`<p class="empty">Aucune porte ouverte pour l'instant.</p>`;
}
const mediaURL={};
async function loadMedia(){
  for(const d of opened.values()){
    if(!d.m) continue;
    const m=d.m;
    try{
      if(!mediaURL[m.f]){
        const buf=await (await fetch(m.f)).arrayBuffer();
        const raw=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(m.iv)},d._k,buf);
        mediaURL[m.f]=URL.createObjectURL(new Blob([raw],{type:m.t}));
      }
      const el=$(m.el), a=$(m.dl);
      if(el) el.src=mediaURL[m.f];
      if(a){a.href=mediaURL[m.f];a.download=m.name;}
    }catch(_){const a=$(m.dl); if(a) a.textContent="Recharge la page.";}
  }
}
function save(){try{localStorage.setItem("coffre",JSON.stringify([...opened.keys()]))}catch(_){}}
let turns=0;
$("f").addEventListener("submit",async ev=>{
  ev.preventDefault();
  const code=norm($("code").value); if(!code) return;
  $("go").disabled=true; $("status").className="status"; $("status").textContent="…"; $("note").hidden=true;
  turns+=1; $("dial").style.transform=`rotate(${turns*137}deg)`;
  const r=await tryCode(code);
  $("go").disabled=false;
  if(!r){$("status").className="status bad";$("status").textContent="Rien ne s'ouvre.";return;}
  if(r.decoy){$("status").textContent="";$("note").innerHTML=r.html;$("note").hidden=false;return;}
  if([...opened.values()].some(x=>x.n===r.n)){$("status").textContent="C'est déjà ouvert.";return;}
  opened.set(code,r); save(); render(); loadMedia(); $("code").value="";
  $("status").textContent=r.msg||(r.final?"La dernière porte est ouverte.":"Une porte s'ouvre.");
});
(async()=>{
  let saved=[]; try{saved=JSON.parse(localStorage.getItem("coffre")||"[]")}catch(_){}
  for(const c of saved){const r=await tryCode(c); if(r&&!r.decoy&&![...opened.values()].some(x=>x.n===r.n)) opened.set(c,r);}
  render(); loadMedia();
})();
</script>

</html>
